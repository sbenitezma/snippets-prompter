<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Snippets Prompter: store, organize and reuse your prompts with fill-in variables."
    />
    <title>Snippets Prompter</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong one.
      // Key and values mirror src/hooks/useTheme.ts.
      try {
        const theme = localStorage.getItem('snippets-prompter:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
